global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'devops-app'
    static_configs:
      - targets: ['devops-app:80']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'terraform-devops-app'
    static_configs:
      - targets: ['terraform-devops-app:80']
    metrics_path: '/metrics'
    scrape_interval: 30s
